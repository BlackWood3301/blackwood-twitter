<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackwood - Создать аккаунт</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fab fa-blackwood"></i>
                <span>Blackwood</span>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="btn btn-login">На главную</a>
            </div>
        </div>
    </nav>

    <main class="signup-container">
        <div class="signup-card">
            <h1>Создать аккаунт</h1>
            <p class="signup-subtitle">Присоединяйтесь к сообществу Blackwood</p>

            <form id="signupForm" class="signup-form">
                <div class="avatar-upload">
                    <div class="avatar-preview">
                        <img id="avatarPreview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" alt="Avatar Preview">
                    </div>
                    <div class="avatar-controls">
                        <button type="button" class="btn btn-secondary" onclick="generateNewAvatar()">
                            <i class="fas fa-random"></i> Сгенерировать
                        </button>

                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <div class="username-input">
                        <span class="username-prefix">@</span>
                        <input type="text" id="username" name="username" required placeholder="username">
                    </div>
                    <div class="validation-message"></div>
                </div>

                <div class="form-group">
                    <label for="displayName">Отображаемое имя</label>
                    <input type="text" id="displayName" name="displayName" required placeholder="Ваше имя">
                    <div class="validation-message"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <div class="validation-message"></div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-meter">
                            <div class="strength-bar"></div>
                        </div>
                        <div class="strength-text">Сложность пароля: <span>Слабый</span></div>
                    </div>
                    <div class="validation-message"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Подтвердите пароль</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <div class="validation-message"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
            </form>

            <p class="login-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </div>
    </main>

    <style>
    /* Добавьте эти стили в ваш CSS файл */
    .username-input {
        position: relative;
        display: flex;
        align-items: center;
    }

    .username-prefix {
        position: absolute;
        left: 1rem;
        color: var(--light-text);
        font-weight: 500;
    }

    .username-input input {
        padding-left: 2rem;
    }

    .username-input input::placeholder {
        color: var(--light-text);
        opacity: 0.7;
    }
    </style>

    <!-- Подключаем API -->
    <script src="js/api.js"></script>
    <script>
        /* Закомментируем код проверки авторизации
        // Проверяем, авторизован ли пользователь
        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    // Получаем информацию о текущем пользователе
                    const user = await userApi.getCurrentUser();
                    console.log('Получены данные пользователя:', user);
                    
                    // Предзаполняем форму
                    if (user.email) document.getElementById('email').value = user.email;
                    if (user.nick_name) document.getElementById('username').value = user.nick_name;
                    if (user.name) document.getElementById('displayName').value = user.name;
                    
                    // Если есть аватар, устанавливаем его
                    if (user.image) {
                        document.getElementById('avatarPreview').src = user.image;
                        currentAvatarSeed = user.nick_name || 'user'; // Используем ник как seed
                    }
                    
                } catch (error) {
                    console.error('Ошибка при получении данных пользователя:', error);
                    // Если токен невалидный, удаляем его
                    localStorage.removeItem('token');
                }
            }
        }

        // Запускаем проверку авторизации при загрузке страницы
        window.addEventListener('DOMContentLoaded', checkAuth);
        */

        // Генерация нового аватара
        let currentAvatarSeed = 'default';
        
        function generateNewAvatar() {
            currentAvatarSeed = Math.random().toString(36).substring(7);
            document.getElementById('avatarPreview').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentAvatarSeed}`;
        }

        // Загрузка изображения
        let uploadedImage = null;
        
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').src = e.target.result;
                    uploadedImage = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // Переключение видимости пароля
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Проверка сложности пароля
        function checkPasswordStrength(password) {
            let strength = 0;
            const feedback = [];

            // Длина пароля
            if (password.length >= 8) {
                strength += 1;
            } else {
                feedback.push('Пароль должен содержать минимум 8 символов');
            }

            // Наличие цифр
            if (/\d/.test(password)) {
                strength += 1;
            } else {
                feedback.push('Добавьте цифры');
            }

            // Наличие заглавных букв
            if (/[A-Z]/.test(password)) {
                strength += 1;
            } else {
                feedback.push('Добавьте заглавные буквы');
            }

            // Наличие специальных символов
            if (/[!@#$%^&*]/.test(password)) {
                strength += 1;
            } else {
                feedback.push('Добавьте специальные символы (!@#$%^&*)');
            }

            return { strength, feedback };
        }

        // Обновление индикатора сложности пароля
        function updatePasswordStrength(password) {
            const { strength, feedback } = checkPasswordStrength(password);
            const strengthBar = document.querySelector('.strength-bar');
            const strengthText = document.querySelector('.strength-text span');
            const validationMessage = document.querySelector('#password + .validation-message');

            // Обновление полосы прогресса
            strengthBar.style.width = `${(strength / 4) * 100}%`;
            
            // Обновление цвета и текста
            if (strength <= 1) {
                strengthBar.style.backgroundColor = '#ff4444';
                strengthText.textContent = 'Слабый';
            } else if (strength <= 2) {
                strengthBar.style.backgroundColor = '#ffbb33';
                strengthText.textContent = 'Средний';
            } else if (strength <= 3) {
                strengthBar.style.backgroundColor = '#00C851';
                strengthText.textContent = 'Хороший';
            } else {
                strengthBar.style.backgroundColor = '#007E33';
                strengthText.textContent = 'Отличный';
            }

            // Обновление сообщения валидации
            validationMessage.textContent = feedback.join(', ');
            validationMessage.style.color = strength <= 2 ? '#ff4444' : '#00C851';
        }

        // Показ сообщения об ошибке
        function showError(element, message) {
            if (!element) {
                console.error('Элемент не найден:', element);
                alert(message); // Если элемент не найден, показываем сообщение через alert
                return;
            }
            
            const validationMessage = element.querySelector('.validation-message');
            if (!validationMessage) {
                console.error('Элемент .validation-message не найден внутри:', element);
                alert(message); // Если .validation-message не найден, показываем сообщение через alert
                return;
            }
            
            validationMessage.textContent = message;
            validationMessage.style.display = 'block';
            validationMessage.style.color = '#ff4444';
        }

        // Валидация формы
        function validateForm() {
            let isValid = true;
            
            // Проверка, что все поля заполнены
            const requiredFields = ['username', 'displayName', 'email', 'password', 'confirmPassword'];
            for (const fieldId of requiredFields) {
                const field = document.getElementById(fieldId);
                if (!field.value.trim()) {
                    showError(field.parentNode, 'Это поле обязательно для заполнения');
                    isValid = false;
                }
            }
            
            // Валидация имени пользователя
            const username = document.getElementById('username').value;
            if (username.trim() && !validateUsername(username)) {
                showError(document.getElementById('username').parentNode, 
                    'Имя пользователя может содержать только буквы, цифры и подчеркивания');
                isValid = false;
            }
            
            // Валидация паролей
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password && confirmPassword && password !== confirmPassword) {
                showError(document.getElementById('confirmPassword').parentNode, 'Пароли не совпадают');
                isValid = false;
            }

            if (password) {
                const { strength } = checkPasswordStrength(password);
                if (strength < 3) {
                    showError(document.getElementById('password').parentNode, 'Пожалуйста, используйте более сложный пароль');
                    isValid = false;
                }
            }
            
            return isValid;
        }

        // Обработка формы
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Очищаем все сообщения об ошибках
            const validationMessages = document.querySelectorAll('.validation-message');
            validationMessages.forEach(element => {
                element.textContent = '';
                element.style.display = 'none';
            });
            
            if (!validateForm()) {
                return;
            }
            
            const username = document.getElementById('username').value;
            const displayName = document.getElementById('displayName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Формируем данные для отправки
            const userData = {
                nick_name: username,
                name: displayName,
                email: email,
                password: password,
                image: uploadedImage || `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentAvatarSeed}`
            };
            
            try {
                console.log('Отправляем данные на регистрацию:', userData);
                
                // Отправляем запрос на регистрацию
                const response = await fetch('http://localhost:8000/user/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });
                
                console.log('Получен ответ от сервера:', response);
                
                const result = await response.json();
                console.log('Данные ответа:', result);
                
                if (response.ok) {
                    console.log('Запрос успешен, получен токен:', result.access_token);
                    // Сохраняем токен в localStorage
                    if (result.access_token) {
                        localStorage.setItem('token', result.access_token);
                    }
                    
                    // Перенаправляем на ленту новостей
                    window.location.href = 'signup.html';
                } else {
                    // Показываем ошибку
                    const errorMessage = result.message || result.detail || 'Ошибка при регистрации';
                    console.error('Ошибка в ответе сервера:', errorMessage);
                    
                    // Особое сообщение для ошибки 422
                    if (response.status === 422) {
                        console.error('Ошибка валидации данных:', result);
                        const validationErrors = result.detail || [];
                        
                        let errorDetails = 'Проблемы с данными формы:';
                        if (Array.isArray(validationErrors)) {
                            validationErrors.forEach(err => {
                                errorDetails += `\n- ${err.loc.join('.')}: ${err.msg}`;
                            });
                            alert(`Ошибка валидации данных: ${errorDetails}`);
                        } else {
                            alert('Ошибка валидации данных: ' + JSON.stringify(result));
                        }
                    } else {
                        alert('Ошибка: ' + errorMessage);
                    }
                }
            } catch (error) {
                console.error('Ошибка при отправке запроса:', error);
                alert('Ошибка сервера: ' + error.message);
            }
        });

        // Обработка ввода пароля
        document.getElementById('password').addEventListener('input', function(e) {
            updatePasswordStrength(e.target.value);
        });

        // Добавьте эту функцию в ваш JavaScript
        function validateUsername(username) {
            // Только буквы, цифры и подчеркивания
            const usernameRegex = /^[a-zA-Z0-9_]+$/;
            return usernameRegex.test(username);
        }
    </script>
</body>
</html>

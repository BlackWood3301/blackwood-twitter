<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackwood - Вход</title>
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="/static/styles/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fab fa-blackwood"></i>
                <span>Blackwood</span>
            </div>
            <div class="nav-buttons">
                <a href="/" class="btn btn-login">На главную</a>
            </div>
        </div>
    </nav>

    <main class="signup-container">
        <div class="signup-card">
            <h1>Войти в аккаунт</h1>
            <p class="signup-subtitle">С возвращением в Blackwood</p>

            <form id="loginForm" class="signup-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <div class="validation-message"></div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <div class="validation-message"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Войти</button>
            </form>

            <p class="login-link">Нет аккаунта? <a href="/signup">регистрация</a></p>
        </div>
    </main>

    <!-- Подключаем API -->
    <script src="/static/js/api.js"></script>
    <script>
        // Переключение видимости пароля
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Обработка отправки формы для регистрации
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Очищаем предыдущие сообщения об ошибках
            const validationMessages = document.querySelectorAll('.validation-message');
            validationMessages.forEach(element => {
                element.textContent = '';
                element.style.display = 'none';
            });
            
            // Получаем данные из формы
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                console.log('Выполняем вход с учетными данными:', { email });
                
                // Отправляем запрос на вход
                const response = await fetch('/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                console.log('Статус ответа:', response.status, response.statusText);
                
                // Получаем текст ответа сначала в виде строки
                const responseText = await response.text();
                console.log('Текст ответа:', responseText);
                
                // Затем пробуем распарсить JSON
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (e) {
                    console.error('Ошибка парсинга JSON:', e);
                }
                
                console.log('Результат входа:', result);
                
                if (response.ok) {
                    // Проверяем куки перед сохранением токена
                    console.log('Куки до сохранения токена:', document.cookie);
                    
                    // Сохраняем токен, если он есть в ответе
                    if (result.access_token) {
                        localStorage.setItem('token', result.access_token);
                    }
                    
                    // Куки после сохранения токена
                    console.log('Куки после сохранения токена:', document.cookie);
                    
                    // Используем короткую задержку перед перенаправлением
                    setTimeout(() => {
                        console.log('Куки перед перенаправлением:', document.cookie);
                        // Перенаправляем на ленту новостей
                        window.location.href = '/feed';
                    }, 500);
                } else {
                    // Показываем ошибку
                    const errorMessage = result.message || 'Ошибка при входе в систему';
                    validationMessages.forEach(element => {
                        element.textContent = errorMessage;
                        element.style.display = 'block';
                    });
                }
            } catch (error) {
                console.error('Ошибка при отправке запроса:', error);
                validationMessages.forEach(element => {
                    element.textContent = 'Ошибка сервера: не удалось выполнить запрос';
                    element.style.display = 'block';
                });
            }
        });
    </script>
</body>
</html>
